<!doctype html>
<html lang="en" class="gn-tv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BID-COIN!</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/gn.css">
<link rel="stylesheet" href="/fonts/bungee/400.css">
<link rel="stylesheet" href="/bc-tv.css">
</head>
<body>
<div id="yard" aria-hidden="true"><div class="art" id="art"></div><div class="veil"></div></div>
<div id="app">
  <header id="top"></header>
  <main id="stage"></main>
  <footer id="dock"></footer>
</div>
<div id="splash" aria-live="polite"></div>
<div id="caption" aria-live="polite"></div>
<div id="controls">
  <button id="bMusic">Music on</button>
  <button id="bSfx">Sounds on</button>
  <button id="bVoice">Auctioneer on</button>
  <button id="bSkip" title="Space bar">Skip</button>
  <button id="bFull">Full screen</button>
  <a href="/tv" id="bMenu">Games</a>
</div>
<div id="gate">
  <div class="gate-in">
    <div class="gate-title">BID-COIN!</div>
    <p class="gate-sub">Storage lockers. Sealed doors. Your money.</p>
    <p>This screen is the auction yard. Everyone bids on their phone. You need 2 to 8 players. Short of people? Add bots from the first phone.</p>
    <button id="bOpen">Open the yard</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/audio.js"></script>
<script src="/bc-tv.js"></script>
<script src="/gn-controls.js"></script>
</body>
</html>
