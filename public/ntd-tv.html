<!doctype html>
<html lang="en" class="gn-tv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nothing to Declare</title>
<link rel="stylesheet" href="/gn.css">
<link rel="stylesheet" href="/fonts/shrikhand/400.css">
<link rel="stylesheet" href="/fonts/bricolage/600.css">
<link rel="stylesheet" href="/fonts/bricolage/800.css">
<link rel="stylesheet" href="/fonts/courier/400.css">
<link rel="stylesheet" href="/fonts/courier/700.css">
<link rel="stylesheet" href="/ntd/tv.css">
</head>
<body>
<div id="hall" aria-hidden="true"><div class="art" id="art"></div><div class="veil"></div></div>
<div id="app">
  <header id="top"></header>
  <main id="stage"></main>
  <div id="tannoy" aria-live="polite"></div>
  <footer id="dock"></footer>
</div>
<div id="controls">
  <button id="bMusic">Music on</button>
  <button id="bSfx">Sounds on</button>
  <button id="bVoice">Brenda on</button>
  <button id="bSkip" title="Space bar">Skip</button>
  <button id="bFull">Full screen</button>
  <a href="/tv" id="bMenu">Games</a>
</div>
<div id="gate">
  <div class="gate-in">
    <div class="gate-title">Nothing to Declare</div>
    <p class="gate-sub">Smuggle. Bribe. Lie.</p>
    <p>This screen is the arrivals hall. Everyone packs their suitcase on their phone. You need 2 to 8 players. Short of people? Add bots from the first phone.</p>
    <button id="bOpen">Open the hall</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/audio.js"></script>
<script src="/ntd/tv.js"></script>
<script src="/gn-controls.js"></script>
</body>
</html>
