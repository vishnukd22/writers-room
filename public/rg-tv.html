<!doctype html>
<html lang="en" class="gn-tv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIGGED!</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/gn.css">
<link rel="stylesheet" href="/fonts/shrikhand/400.css">
<link rel="stylesheet" href="/rg-tv.css">
</head>
<body>
<div id="studio" aria-hidden="true"><div class="art" id="art"></div><div class="curtain l"></div><div class="curtain r"></div><div class="floor"></div></div>
<div id="app">
  <header id="top"></header>
  <aside id="board"></aside>
  <main id="stage"></main>
  <footer id="dock"></footer>
</div>
<div id="ticker" aria-live="polite"></div>
<div id="caption" aria-live="polite"></div>
<div id="controls">
  <button id="bMusic">Music on</button>
  <button id="bSfx">Sounds on</button>
  <button id="bVoice">Vince on</button>
  <button id="bSkip" title="Space bar">Skip</button>
  <button id="bFull">Full screen</button>
  <a href="/tv" id="bMenu">Games</a>
</div>
<div id="gate">
  <div class="gate-in">
    <div class="gate-title">RIGGED!</div>
    <p class="gate-sub">The quiz show where everything is for sale.</p>
    <p>This screen is the studio. Everyone plays on their phone. You need 2 to 8 players. With just 2, the House plays too. Short of people? Add bots from the first phone.</p>
    <button id="bOpen">Open the studio</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/audio.js"></script>
<script src="/rg-tv.js"></script>
<script src="/gn-controls.js"></script>
</body>
</html>
