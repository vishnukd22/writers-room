<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2A3A">
<title>Writers' Room</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/play.css">
</head>
<body>
<section id="join">
  <div class="jtitle">Writers'<br>Room<span class="hand">You write it. They perform it.</span></div>
  <form id="jform" autocomplete="off">
    <label>Room code<input id="jcode" maxlength="4" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required></label>
    <label>Your name<input id="jname" maxlength="14" placeholder="Arun" required></label>
    <label>How do you say it? <span class="opt">Optional, for the narrator</span><input id="jpron" maxlength="30" placeholder="AH-roon"></label>
    <button class="btn primary big" type="submit">Join the room</button>
    <p id="jerr" class="err" role="alert"></p>
  </form>
</section>
<section id="app" hidden>
  <header id="hud"></header>
  <main id="main"></main>
</section>
<div id="toasts" aria-live="polite"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/play.js"></script>
</body>
</html>
