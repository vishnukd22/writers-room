<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0C12">
<title>Vishnu's Game Night</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/fonts/bricolage/800.css">
<style>
  /* the front page: same bold dark look as the game menu */
  body { background: #0E0C12; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0); background-size: 22px 22px; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 18px; color: #F6F2FF; }
  .wrap { width: min(30rem, 100%); text-align: center; }
  .logo img { width: min(26rem, 88%); height: auto; display: block; margin: 0 auto .6rem; filter: drop-shadow(0 10px 30px rgba(139, 92, 246, .35)); }
  h1 { font: 800 clamp(2.4rem, 9vw, 3.6rem)/1 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -.03em; margin: 0 0 .5rem; color: #F6F2FF; }
  .sub { color: #A9A1BA; font-size: 1.05rem; margin: 0 0 1.8rem; }
  .card { background: #18151F; border: 3px solid #9B6BFF; border-radius: 22px; padding: 1.4rem 1.3rem 1.5rem; box-shadow: 8px 8px 0 #9B6BFF; text-align: left; }
  .card h2 { margin: 0 0 .9rem; font: 800 1.5rem 'Bricolage Grotesque', system-ui, sans-serif; color: #F6F2FF; }
  label { display: block; color: #A9A1BA; font-weight: 700; margin-bottom: .4rem; }
  input { width: 100%; font: inherit; font-size: 2rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: .6rem; border-radius: 14px; border: 3px solid #2E2839; background: #0E0C12; color: #F6F2FF; }
  input:focus { outline: none; border-color: #FFB21A; }
  .go { width: 100%; margin-top: .9rem; border: 0; border-radius: 14px; padding: 1rem; font: 800 1.3rem 'Bricolage Grotesque', system-ui, sans-serif; background: #FFB21A; color: #1A1200; box-shadow: 0 5px 0 #B34A00; cursor: pointer; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #B34A00; }
  .go:disabled { opacity: .5; }
  .err { color: #FF8AA6; font-weight: 700; min-height: 1.3rem; margin: .6rem 0 0; }
  .host { display: block; margin-top: 1.4rem; color: #A9A1BA; font-size: 1rem; }
  .host a { color: #F6F2FF; font-weight: 800; }
  .big-host { display: none; }
  /* on a big screen (TV or laptop), hosting is the main thing */
  @media (min-width: 900px) and (pointer: fine) {
    .wrap { width: min(44rem, 92vw); }
    .big-host { display: block; text-decoration: none; background: #FFB21A; color: #1A1200; font: 800 1.7rem 'Bricolage Grotesque', system-ui, sans-serif; border-radius: 18px; padding: 1.2rem; margin-bottom: 1.8rem; box-shadow: 0 6px 0 #B34A00; }
    .big-host small { display: block; font: 700 1rem system-ui, sans-serif; opacity: .8; margin-top: .3rem; }
    .host { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" id="logo"><h1>Vishnu's Game Night</h1></div>
  <p class="sub">Last Night in the Mansion, BID-COIN!, RIGGED! and Land Grab</p>
  <a class="big-host" href="/tv">Start a game on this screen<small>Opens the game menu. Everyone else joins on their phone.</small></a>
  <form class="card" id="f" autocomplete="off">
    <h2>Join a game</h2>
    <label for="code">Room code from the TV</label>
    <input id="code" maxlength="4" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required>
    <button class="go" id="go" type="submit">Join</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="host">Hosting on a TV or laptop? <a href="/tv">Open the game menu</a></p>
</div>
<script>
  fetch('/assets-manifest').then((r) => r.json()).then((m) => { const f = ['webp', 'png'].map((e) => `gn-logo.${e}`).find((x) => m.img.includes(x)); if (f) document.getElementById('logo').innerHTML = `<img src="/assets/img/${f}" alt="Vishnu's Game Night">`; }).catch(() => {});
  const f = document.getElementById('f'); const code = document.getElementById('code'); const err = document.getElementById('err'); const go = document.getElementById('go');
  code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); err.textContent = ''; });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const c = code.value.trim();
    if (c.length !== 4) { err.textContent = 'Room codes have 4 letters.'; return; }
    go.disabled = true;
    try {
      const r = await fetch(`/join/${c}`); const d = await r.json();
      if (d.path) location.href = d.path; else { err.textContent = d.error || 'No game with that code.'; go.disabled = false; }
    } catch (x) { err.textContent = 'Could not reach the game. Try again.'; go.disabled = false; }
  });
</script>
</body>
</html>
