<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161B2E">
<title>Vishnu's Game Night</title>
<link rel="stylesheet" href="/base.css">
<style>
  body { background: radial-gradient(ellipse at 50% 0%, #2B3A5C 0%, #161B2E 70%); min-height: 100dvh; display: grid; place-items: center; padding: 2rem 18px; }
  .wrap { width: min(30rem, 100%); text-align: center; }
  h1 { font-family: var(--hand); font-weight: 700; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.05; margin: 0 0 .4rem; color: var(--cream); }
  .sub { color: var(--muted); font-size: 1.1rem; margin: 0 0 2rem; }
  .card { background: #0F1322; border-radius: 18px; padding: 1.4rem 1.3rem 1.5rem; box-shadow: 0 30px 60px rgba(0,0,0,.45); text-align: left; }
  .card h2 { margin: 0 0 .9rem; font-size: 1.4rem; color: var(--cream); }
  label { display: block; color: var(--muted); font-weight: 700; margin-bottom: .4rem; }
  input { width: 100%; font: inherit; font-size: 2rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: .6rem; border-radius: 12px; border: 2px solid rgba(255,255,255,.12); background: #1A2036; color: var(--cream); }
  input:focus { outline: none; border-color: #E2A93B; }
  .go { width: 100%; margin-top: .9rem; border: 0; border-radius: 12px; padding: 1rem; font: inherit; font-size: 1.2rem; font-weight: 800; background: #E2A93B; color: #161B2E; }
  .go:disabled { opacity: .5; }
  .err { color: #F09A8A; font-weight: 700; min-height: 1.3rem; margin: .6rem 0 0; }
  .host { display: block; margin-top: 1.4rem; color: var(--muted); font-size: 1rem; }
  .host a { color: var(--cream); font-weight: 800; }
  .big-host { display: none; }
  /* on a big screen (TV or laptop), hosting is the main thing */
  @media (min-width: 900px) and (pointer: fine) {
    .wrap { width: min(44rem, 92vw); }
    .big-host { display: block; text-decoration: none; background: #E2A93B; color: #161B2E; font-weight: 800; font-size: 1.6rem; border-radius: 16px; padding: 1.2rem; margin-bottom: 1.6rem; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
    .big-host small { display: block; font-size: 1rem; font-weight: 700; opacity: .8; }
    .host { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vishnu's Game Night</h1>
  <p class="sub">Writers' Room, Land Grab and BID-COIN!</p>
  <a class="big-host" href="/tv">Start a game on this screen<small>Opens the game menu. Everyone else joins on their phone.</small></a>
  <form class="card" id="f" autocomplete="off">
    <h2>Join a game</h2>
    <label for="code">Room code from the TV</label>
    <input id="code" maxlength="4" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required>
    <button class="go" id="go" type="submit">Join</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="host">Hosting on a TV or laptop? <a href="/tv">Open the game menu</a></p>
</div>
<script>
  const f = document.getElementById('f'); const code = document.getElementById('code'); const err = document.getElementById('err'); const go = document.getElementById('go');
  code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); err.textContent = ''; });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const c = code.value.trim();
    if (c.length !== 4) { err.textContent = 'Room codes have 4 letters.'; return; }
    go.disabled = true;
    try {
      const r = await fetch(`/join/${c}`); const d = await r.json();
      if (d.path) location.href = d.path; else { err.textContent = d.error || 'No game with that code.'; go.disabled = false; }
    } catch (x) { err.textContent = 'Could not reach the game. Try again.'; go.disabled = false; }
  });
</script>
</body>
</html>
